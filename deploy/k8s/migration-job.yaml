apiVersion: batch/v1
kind: Job
metadata:
  name: atas-migrate
  namespace: atas
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: ghcr.io/liliumfra/atas:1.3.0
          command: ['node', 'dist/src/db/migrate.js']
          envFrom:
            - configMapRef:
                name: atas-config
            - secretRef:
                name: atas-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ['ALL']
