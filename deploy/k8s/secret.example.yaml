apiVersion: v1
kind: Secret
metadata:
  name: atas-secrets
  namespace: atas
type: Opaque
stringData:
  DATABASE_URL: postgres://atas:replace-me@postgres.example.internal:5432/atas?sslmode=require
  JWT_SECRET: replace-with-at-least-32-random-bytes
  AUDIT_HMAC_SECRET: replace-with-a-different-at-least-32-byte-secret
